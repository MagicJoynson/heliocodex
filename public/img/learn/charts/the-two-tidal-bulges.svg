<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="1100" height="560">
<rect width="1100" height="560" fill="#07080c"/>
<defs><radialGradient id="glow"><stop offset="0" stop-color="#ffe2a8"/><stop offset=".35" stop-color="#f0c27a"/><stop offset="1" stop-color="#f0c27a" stop-opacity="0"/></radialGradient></defs>
<ellipse cx="430" cy="280" rx="168" ry="120" fill="#2f5d8a" fill-opacity=".55"/>
<circle cx="430" cy="280" r="110" fill="#3b4a3a"/><circle cx="430" cy="280" r="110" fill="none" stroke="#ece7dc" stroke-opacity=".25"/>
<circle cx="430" cy="280" r="130" fill="none" stroke="#ece7dc" stroke-opacity=".3" stroke-dasharray="3 6"/>
<text x="430.0" y="288.0" font-size="22" fill="#ece7dc" text-anchor="middle" >Earth</text>
<circle cx="1010" cy="280" r="30" fill="#d9d4c7"/><text x="1010.0" y="344.0" font-size="22" fill="#ece7dc" text-anchor="middle" >Moon</text>
<line x1="540" y1="280" x2="632" y2="280" stroke="#e9c48a" stroke-width="3"/><path d="M621,272 L633,280 L621,288" fill="none" stroke="#e9c48a" stroke-width="3"/>
<line x1="430" y1="320" x2="496" y2="320" stroke="#e9c48a" stroke-width="3"/><path d="M485,312 L497,320 L485,328" fill="none" stroke="#e9c48a" stroke-width="3"/>
<line x1="320" y1="280" x2="366" y2="280" stroke="#e9c48a" stroke-width="3"/><path d="M355,272 L367,280 L355,288" fill="none" stroke="#e9c48a" stroke-width="3"/>
<text x="670.0" y="224.0" font-size="24" fill="#ece7dc" text-anchor="start" >High tide</text>
<text x="670.0" y="252.0" font-size="20" fill="#a9a396" text-anchor="start" >This side is pulled hardest,</text>
<text x="670.0" y="276.0" font-size="20" fill="#a9a396" text-anchor="start" >so its water heaps towards the Moon</text>
<text x="250.0" y="224.0" font-size="24" fill="#ece7dc" text-anchor="end" >High tide</text>
<text x="250.0" y="252.0" font-size="20" fill="#a9a396" text-anchor="end" >This side is pulled least,</text>
<text x="250.0" y="276.0" font-size="20" fill="#a9a396" text-anchor="end" >so its water is left behind</text>
<text x="430.0" y="130.0" font-size="24" fill="#ece7dc" text-anchor="middle" >Low tide</text>
<text x="430.0" y="446.0" font-size="24" fill="#ece7dc" text-anchor="middle" >Low tide</text>
<text x="700.0" y="530.0" font-size="19" fill="#e9c48a" text-anchor="middle" >Gold arrows: the Moon’s pull on each part of the Earth</text>
</svg>