<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" font-family="Georgia, 'Times New Roman', serif"><rect width="800" height="420" fill="#07080c"/><text x="30.0" y="58.0" font-size="34" fill="#ece7dc" text-anchor="start" >Burning, like coal</text><text x="770.0" y="58.0" font-size="32" fill="#a9a396" text-anchor="end" >about 5,000 years</text><rect x="30" y="76" width="157.2" height="22" fill="#e58a6a"/><text x="30.0" y="168.0" font-size="34" fill="#ece7dc" text-anchor="start" >Shrinking under its own weight</text><text x="770.0" y="168.0" font-size="32" fill="#a9a396" text-anchor="end" >about 30 million years</text><rect x="30" y="186" width="506.6" height="22" fill="#8fb8e8"/><text x="30.0" y="278.0" font-size="34" fill="#ece7dc" text-anchor="start" >Fusing hydrogen</text><text x="770.0" y="278.0" font-size="32" fill="#a9a396" text-anchor="end" >about 10 billion years</text><rect x="30" y="296" width="740.0" height="22" fill="#e9c48a"/><text x="30.0" y="398.0" font-size="32" fill="#a9a396" text-anchor="start" >Each eighth of the width is ten times longer.</text></svg>
