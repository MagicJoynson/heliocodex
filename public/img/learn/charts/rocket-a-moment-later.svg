<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" font-family="Georgia, 'Times New Roman', serif" style="font-variant-numeric: lining-nums"><rect width="800" height="600" fill="#07080c"/><defs><marker id="rk-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e9c48a"/></marker><marker id="rk-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8fc3dc"/></marker><marker id="rk-w" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a9a396"/></marker><marker id="rk-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d98a6a"/></marker><marker id="rk-c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ece7dc"/></marker></defs><text x="40" y="64" font-size="36" fill="#a9a396" text-anchor="start" stroke="#07080c" stroke-width="8" paint-order="stroke">before</text><path d="M160,114 L360,114 Q400,140 360,166 L160,166 Z" fill="#1a2430" stroke="#ece7dc" stroke-width="2.5"/><line x1="420.0" y1="140.0" x2="560.0" y2="140.0" stroke="#e9c48a" stroke-width="5" marker-end="url(#rk-g)"/><text x="280" y="215" font-size="36" fill="#ece7dc" text-anchor="middle" stroke="#07080c" stroke-width="8" paint-order="stroke">mass m, speed v</text><text x="40" y="304" font-size="36" fill="#a9a396" text-anchor="start" stroke="#07080c" stroke-width="8" paint-order="stroke">a moment later</text><path d="M300,364 L500,364 Q540,390 500,416 L300,416 Z" fill="#1a2430" stroke="#ece7dc" stroke-width="2.5"/><line x1="560.0" y1="390.0" x2="730.0" y2="390.0" stroke="#e9c48a" stroke-width="5" marker-end="url(#rk-g)"/><circle cx="230" cy="390" r="16" fill="#d98a6a"/><line x1="206.0" y1="390.0" x2="70.0" y2="390.0" stroke="#d98a6a" stroke-width="4" marker-end="url(#rk-r)"/><text x="40" y="358" font-size="36" fill="#d98a6a" text-anchor="start" stroke="#07080c" stroke-width="8" paint-order="stroke">dm thrown back</text><text x="420" y="465" font-size="36" fill="#ece7dc" text-anchor="middle" stroke="#07080c" stroke-width="8" paint-order="stroke">mass m − dm, speed v + dv</text><text x="400" y="560" font-size="36" fill="#e9c48a" text-anchor="middle" stroke="#07080c" stroke-width="8" paint-order="stroke">the momentum is the same before and after</text></svg>