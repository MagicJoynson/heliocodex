<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 390" width="800" height="390" font-family="Georgia, 'Times New Roman', serif"><rect width="800" height="390" fill="#07080c"/><text x="30.0" y="58.0" font-size="34" fill="#ece7dc" text-anchor="start" >Dark matter</text><text x="770.0" y="58.0" font-size="32" fill="#a9a396" text-anchor="end" >about 86%</text><rect x="30" y="76" width="740.0" height="22" fill="#b9a7ff"/><text x="30.0" y="158.0" font-size="34" fill="#ece7dc" text-anchor="start" >Hot gas between the galaxies</text><text x="770.0" y="158.0" font-size="32" fill="#a9a396" text-anchor="end" >about 11%</text><rect x="30" y="176" width="94.7" height="22" fill="#8fb8e8"/><text x="30.0" y="258.0" font-size="34" fill="#ece7dc" text-anchor="start" >Stars in the galaxies</text><text x="770.0" y="258.0" font-size="32" fill="#a9a396" text-anchor="end" >about 3%</text><rect x="30" y="276" width="25.8" height="22" fill="#e9c48a"/><text x="30.0" y="368.0" font-size="32" fill="#a9a396" text-anchor="start" >Shares of the mass of a large cluster.</text></svg>
