<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 506" width="800" height="506" font-family="Georgia, 'Times New Roman', serif"><rect width="800" height="506" fill="#07080c"/><text x="30.0" y="58.0" font-size="34" fill="#ece7dc" text-anchor="start" >Air in a room</text><text x="770.0" y="58.0" font-size="32" fill="#a9a396" text-anchor="end" >10 million million million</text><rect x="30" y="76" width="740.0" height="22" fill="#ece7dc"/><text x="30.0" y="162.0" font-size="34" fill="#ece7dc" text-anchor="start" >A thick cloud between the stars</text><text x="770.0" y="162.0" font-size="32" fill="#a9a396" text-anchor="end" >1,000 or more</text><rect x="30" y="180" width="176.2" height="22" fill="#8fb8e8"/><text x="30.0" y="266.0" font-size="34" fill="#ece7dc" text-anchor="start" >Space between the stars, on average</text><text x="770.0" y="266.0" font-size="32" fill="#a9a396" text-anchor="end" >about 1</text><rect x="30" y="284" width="70.5" height="22" fill="#e9c48a"/><text x="30.0" y="370.0" font-size="34" fill="#ece7dc" text-anchor="start" >Space round the Sun</text><text x="770.0" y="370.0" font-size="32" fill="#a9a396" text-anchor="end" >about 0.1</text><rect x="30" y="388" width="35.2" height="22" fill="#b9a7ff"/><text x="30.0" y="484.0" font-size="32" fill="#a9a396" text-anchor="start" >Atoms in a cubic centimetre, by powers of ten.</text></svg>
