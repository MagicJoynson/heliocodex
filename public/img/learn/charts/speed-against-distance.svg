<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 390" width="800" height="390" font-family="Georgia, 'Times New Roman', serif"><rect width="800" height="390" fill="#07080c"/><text x="30.0" y="58.0" font-size="34" fill="#ece7dc" text-anchor="start" >100 million light years</text><text x="770.0" y="58.0" font-size="32" fill="#a9a396" text-anchor="end" >2,100 km/s</text><rect x="30" y="76" width="74.0" height="22" fill="#e9c48a"/><text x="30.0" y="158.0" font-size="34" fill="#ece7dc" text-anchor="start" >500 million</text><text x="770.0" y="158.0" font-size="32" fill="#a9a396" text-anchor="end" >10,500 km/s</text><rect x="30" y="176" width="370.0" height="22" fill="#e9c48a"/><text x="30.0" y="258.0" font-size="34" fill="#ece7dc" text-anchor="start" >1,000 million</text><text x="770.0" y="258.0" font-size="32" fill="#a9a396" text-anchor="end" >21,000 km/s</text><rect x="30" y="276" width="740.0" height="22" fill="#e9c48a"/><text x="30.0" y="368.0" font-size="32" fill="#a9a396" text-anchor="start" >How far off, and how fast it recedes.</text></svg>
