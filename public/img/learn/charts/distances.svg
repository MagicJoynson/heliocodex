<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 856" width="800" height="856" font-family="Georgia, 'Times New Roman', serif"><rect width="800" height="856" fill="#07080c"/><line x1="20.0" y1="20" x2="20.0" y2="776" stroke="#ece7dc" stroke-opacity="0.12"/><line x1="128.6" y1="20" x2="128.6" y2="776" stroke="#ece7dc" stroke-opacity="0.12"/><line x1="237.1" y1="20" x2="237.1" y2="776" stroke="#ece7dc" stroke-opacity="0.12"/><line x1="345.7" y1="20" x2="345.7" y2="776" stroke="#ece7dc" stroke-opacity="0.12"/><line x1="454.3" y1="20" x2="454.3" y2="776" stroke="#ece7dc" stroke-opacity="0.12"/><line x1="562.9" y1="20" x2="562.9" y2="776" stroke="#ece7dc" stroke-opacity="0.12"/><line x1="671.4" y1="20" x2="671.4" y2="776" stroke="#ece7dc" stroke-opacity="0.12"/><line x1="780.0" y1="20" x2="780.0" y2="776" stroke="#ece7dc" stroke-opacity="0.12"/><text x="20" y="60" font-size="32" fill="#a9a396" text-anchor="start">Across the Earth</text><text x="780" y="60" font-size="32" fill="#a9a396" text-anchor="end">12,742 km</text><rect x="20" y="74" width="40.0" height="22" fill="#a9a396"/><text x="20" y="144" font-size="32" fill="#a9a396" text-anchor="start">Earth to the Moon</text><text x="780" y="144" font-size="32" fill="#a9a396" text-anchor="end">384,400 km</text><rect x="20" y="158" width="93.5" height="22" fill="#a9a396"/><text x="20" y="228" font-size="32" fill="#ece7dc" text-anchor="start">Earth to the Sun</text><text x="780" y="228" font-size="32" fill="#ece7dc" text-anchor="end">149.6 million km</text><rect x="20" y="242" width="187.3" height="22" fill="#ece7dc"/><text x="20" y="312" font-size="32" fill="#ece7dc" text-anchor="start">Sun to Neptune</text><text x="780" y="312" font-size="32" fill="#ece7dc" text-anchor="end">4.5 billion km</text><rect x="20" y="326" width="240.8" height="22" fill="#ece7dc"/><text x="20" y="396" font-size="32" fill="#ece7dc" text-anchor="start">Solar wind’s edge</text><text x="780" y="396" font-size="32" fill="#ece7dc" text-anchor="end">18 billion km</text><rect x="20" y="410" width="262.6" height="22" fill="#ece7dc"/><text x="20" y="480" font-size="32" fill="#e9c48a" text-anchor="start">The nearest star</text><text x="780" y="480" font-size="32" fill="#e9c48a" text-anchor="end">4.25 light years</text><rect x="20" y="494" width="383.8" height="22" fill="#e9c48a"/><text x="20" y="564" font-size="32" fill="#e9c48a" text-anchor="start">Middle of the Milky Way</text><text x="780" y="564" font-size="32" fill="#e9c48a" text-anchor="end">26,700 light years</text><rect x="20" y="578" width="521.2" height="22" fill="#e9c48a"/><text x="20" y="648" font-size="32" fill="#e9c48a" text-anchor="start">The Andromeda Galaxy</text><text x="780" y="648" font-size="32" fill="#e9c48a" text-anchor="end">2.5 million light years</text><rect x="20" y="662" width="592.6" height="22" fill="#e9c48a"/><text x="20" y="732" font-size="32" fill="#e9c48a" text-anchor="start">Furthest light we see</text><text x="780" y="732" font-size="32" fill="#e9c48a" text-anchor="end">46 billion light years</text><rect x="20" y="746" width="746.9" height="22" fill="#e9c48a"/><text x="20" y="832" font-size="32" fill="#a9a396" text-anchor="start">Each line is 1,000 times further</text></svg>