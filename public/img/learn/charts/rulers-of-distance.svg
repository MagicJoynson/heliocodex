<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" font-family="Georgia, 'Times New Roman', serif"><rect width="800" height="470" fill="#07080c"/><line x1="112.2" y1="30" x2="112.2" y2="400" stroke="#ece7dc" stroke-opacity=".1"/><line x1="194.4" y1="30" x2="194.4" y2="400" stroke="#ece7dc" stroke-opacity=".1"/><line x1="276.7" y1="30" x2="276.7" y2="400" stroke="#ece7dc" stroke-opacity=".1"/><line x1="358.9" y1="30" x2="358.9" y2="400" stroke="#ece7dc" stroke-opacity=".1"/><line x1="441.1" y1="30" x2="441.1" y2="400" stroke="#ece7dc" stroke-opacity=".1"/><line x1="523.3" y1="30" x2="523.3" y2="400" stroke="#ece7dc" stroke-opacity=".1"/><line x1="605.6" y1="30" x2="605.6" y2="400" stroke="#ece7dc" stroke-opacity=".1"/><line x1="687.8" y1="30" x2="687.8" y2="400" stroke="#ece7dc" stroke-opacity=".1"/><text x="30.0" y="62.0" font-size="26" fill="#ece7dc" text-anchor="start" >The Moon</text><text x="770.0" y="62.0" font-size="22" fill="#a9a396" text-anchor="end" >384,400 km</text><rect x="30" y="76" width="48.1" height="20" fill="#e9c48a"/><text x="30.0" y="154.0" font-size="26" fill="#ece7dc" text-anchor="start" >The Sun</text><text x="770.0" y="154.0" font-size="22" fill="#a9a396" text-anchor="end" >150 million km, or 1 au</text><rect x="30" y="168" width="261.0" height="20" fill="#e9c48a"/><text x="30.0" y="246.0" font-size="26" fill="#ece7dc" text-anchor="start" >Neptune</text><text x="770.0" y="246.0" font-size="22" fill="#a9a396" text-anchor="end" >30 au</text><rect x="30" y="260" width="382.5" height="20" fill="#e9c48a"/><text x="30.0" y="338.0" font-size="26" fill="#ece7dc" text-anchor="start" >The nearest star</text><text x="770.0" y="338.0" font-size="22" fill="#a9a396" text-anchor="end" >4.25 light years</text><rect x="30" y="352" width="707.4" height="20" fill="#b9a7ff"/><text x="30.0" y="440.0" font-size="20" fill="#a9a396" text-anchor="start" >Each faint line is ten times further than the one before.</text></svg>
