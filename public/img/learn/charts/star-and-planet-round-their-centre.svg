<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 780" width="800" height="780" font-family="Georgia, 'Times New Roman', serif" style="font-variant-numeric: lining-nums"><rect width="800" height="780" fill="#07080c"/><defs><marker id="cm-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e9c48a"/></marker><marker id="cm-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8fc3dc"/></marker><marker id="cm-w" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a9a396"/></marker><marker id="cm-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d98a6a"/></marker><marker id="cm-c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ece7dc"/></marker></defs><circle cx="320" cy="400" r="62" fill="none" stroke="#e9c48a" stroke-opacity=".7" stroke-width="2.5" stroke-dasharray="6 7"/><circle cx="320" cy="400" r="230" fill="none" stroke="#8fc3dc" stroke-opacity=".7" stroke-width="2.5" stroke-dasharray="6 7"/><circle cx="258" cy="400" r="46" fill="#e9c48a"/><circle cx="550" cy="400" r="15" fill="#8fc3dc"/><line x1="308.0" y1="400.0" x2="332.0" y2="400.0" stroke="#ece7dc" stroke-width="3"/><line x1="320.0" y1="388.0" x2="320.0" y2="412.0" stroke="#ece7dc" stroke-width="3"/><line x1="550.0" y1="374.0" x2="550.0" y2="250.0" stroke="#8fc3dc" stroke-width="4" marker-end="url(#cm-b)"/><line x1="258.0" y1="456.0" x2="258.0" y2="512.0" stroke="#e9c48a" stroke-width="4" marker-end="url(#cm-g)"/><text x="578" y="413" font-size="36" fill="#8fc3dc" text-anchor="start" stroke="#07080c" stroke-width="8" paint-order="stroke">planet</text><text x="578" y="296" font-size="36" fill="#8fc3dc" text-anchor="start" stroke="#07080c" stroke-width="8" paint-order="stroke">fast</text><text x="198" y="413" font-size="36" fill="#e9c48a" text-anchor="end" stroke="#07080c" stroke-width="8" paint-order="stroke">star</text><text x="240" y="504" font-size="36" fill="#e9c48a" text-anchor="end" stroke="#07080c" stroke-width="8" paint-order="stroke">slow</text><line x1="326.0" y1="420.0" x2="350.0" y2="528.0" stroke="#a9a396" stroke-width="2"/><text x="350" y="570" font-size="36" fill="#ece7dc" text-anchor="middle" stroke="#07080c" stroke-width="8" paint-order="stroke">shared centre</text><text x="400" y="56" font-size="36" fill="#ece7dc" text-anchor="middle" stroke="#07080c" stroke-width="8" paint-order="stroke">star’s mass × its speed</text><text x="400" y="104" font-size="36" fill="#ece7dc" text-anchor="middle" stroke="#07080c" stroke-width="8" paint-order="stroke">= planet’s mass × its speed</text><line x1="750.0" y1="560.0" x2="750.0" y2="700.0" stroke="#a9a396" stroke-width="3" marker-end="url(#cm-w)"/><text x="730" y="690" font-size="36" fill="#a9a396" text-anchor="end" stroke="#07080c" stroke-width="8" paint-order="stroke">to us</text><text x="30" y="716" font-size="36" fill="#a9a396" text-anchor="start" stroke="#07080c" stroke-width="8" paint-order="stroke">not to scale: the star’s</text><text x="30" y="758" font-size="36" fill="#a9a396" text-anchor="start" stroke="#07080c" stroke-width="8" paint-order="stroke">circle is drawn far too big</text></svg>