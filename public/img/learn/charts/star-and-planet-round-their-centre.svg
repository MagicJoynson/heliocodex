ow</text><line x1="328" y1="330" x2="390" y2="430" stroke="#a9a396" stroke-width="2"/><text x="400" y="462" font-size="32" fill="#ece7dc" text-anchor="start" stroke="#07080c" stroke-width="7" paint-order="stroke" >shared centre</text><line x1="740" y1="470" x2="740" y2="590" stroke="#a9a396" stroke-width="3" marker-end="url(#cm-w)"/><text x="718" y="560" font-size="32" fill="#a9a396" text-anchor="end" stroke="#07080c" stroke-width="7" paint-order="stroke" >to us</text><text x="400" y="54" font-size="32" fill="#ece7dc" text-anchor="middle" stroke="#07080c" stroke-width="7" paint-order="stroke" >star’s mass × its speed</text><text x="400" y="98" font-size="32" fill="#ece7dc" text-anchor="middle" stroke="#07080c" stroke-width="7" paint-order="stroke" >= planet’s mass × its speed</text><text x="30" y="612" font-size="28" fill="#a9a396" text-anchor="start" stroke="#07080c" stroke-width="7" paint-order="stroke" >not to scale</text></svg>