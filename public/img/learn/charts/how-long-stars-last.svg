<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 506" width="800" height="506" font-family="Georgia, 'Times New Roman', serif"><rect width="800" height="506" fill="#07080c"/><text x="30.0" y="58.0" font-size="34" fill="#ece7dc" text-anchor="start" >A tenth of the Sun's mass</text><text x="770.0" y="58.0" font-size="32" fill="#a9a396" text-anchor="end" >3 million million years</text><rect x="30" y="76" width="691.6" height="22" fill="#e58a6a"/><text x="30.0" y="162.0" font-size="34" fill="#ece7dc" text-anchor="start" >The Sun</text><text x="770.0" y="162.0" font-size="32" fill="#a9a396" text-anchor="end" >10 billion years</text><rect x="30" y="180" width="462.5" height="22" fill="#e9c48a"/><text x="30.0" y="266.0" font-size="34" fill="#ece7dc" text-anchor="start" >Ten Suns</text><text x="770.0" y="266.0" font-size="32" fill="#a9a396" text-anchor="end" >30 million years</text><rect x="30" y="284" width="229.1" height="22" fill="#8fb8e8"/><text x="30.0" y="370.0" font-size="34" fill="#ece7dc" text-anchor="start" >Twenty-five Suns</text><text x="770.0" y="370.0" font-size="32" fill="#a9a396" text-anchor="end" >3 million years</text><rect x="30" y="388" width="136.6" height="22" fill="#b9a7ff"/><text x="30.0" y="484.0" font-size="32" fill="#a9a396" text-anchor="start" >Each eighth of the width is ten times longer.</text></svg>
