summary: "A star near the end of its life swells to a size that is hard to believe. The biggest would swallow the inner planets whole, yet are thinner than the air you breathe."
scene: "A moving drawing to scale of the Sun swelling into a red giant, a drawing to scale of the Sun beside five giant stars, real pictures of the faces of two supergiants and of the first star seen close up in another galaxy, and a real photograph of what a supergiant leaves behind."
