summary: "The Sun will die, the galaxies will run out of gas, and the last stars will go out. What happens after that depends on something nobody yet understands."
scene: "Real photographs of a dying star like the Sun, of the Andromeda galaxy and of an exploding star, and drawings of the stars going out, of the long ages to come, and of three ways the universe could end."
