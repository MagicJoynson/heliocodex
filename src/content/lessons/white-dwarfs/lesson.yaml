summary: "A white dwarf is the core a star like the Sun leaves behind: the mass of a star in a ball the size of the Earth, with no fuel left, slowly cooling."
scene: "Sirius, the brightest star in the sky, among the Sun's neighbours. Beside it, far too faint and close to pick out, goes a white dwarf as heavy as the Sun and smaller than the Earth."
