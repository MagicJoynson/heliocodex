summary: "A nebula is a cloud of gas and dust between the stars. Some are where stars are being born, and others are what dying stars leave behind."
scene: "The stars of Orion hang in the dark. Below the three stars of the belt, where the eye sees a faint smudge, thousands of new stars are forming inside a cloud."
