summary: "A nebula is a cloud of gas and dust between the stars. Some are where stars are being born, and others are what dying stars leave behind."
scene: "Drawings that follow the first look: a cloud of gas and dust, a clump falling in on itself until a star begins, where to find the Orion Nebula beside the belt, a dying star puffing its layers away, and the round that turns old gas into new stars."
