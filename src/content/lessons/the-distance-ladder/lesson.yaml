summary: "Some stars brighten and fade on a steady beat, and the beat gives away how bright they truly are. That is how the distances to other galaxies were first measured."
scene: "Our galaxy and its neighbours from outside, with Andromeda marked: the first galaxy to have its distance measured from a single pulsing star."
