summary: "Some stars brighten and fade on a steady beat, and the beat gives away how bright they truly are. That is how the distances to other galaxies were first found."
scene: "Drawings that follow the first look: a variable star and its changing brightness, two Cepheids with slow and quick beats, a torch against a lighthouse, Hubble’s Cepheid in Andromeda, and one whole beat as a graph."
