summary: "The strongest magnets and the brightest explosions there are both come from dying stars. One burst can give out more energy in seconds than the Sun will in its whole life."
scene: "A chart of magnets from a compass needle to a magnetar, a real infrared picture of the ring round a magnetar, a moving diagram of a starquake, a moving diagram of the two narrow jets of a burst, the real X-ray picture of the brightest burst ever recorded, and a real photograph of the glow left by two neutron stars colliding."
