summary: "Many stars come in pairs, threes or more, circling one another. Their orbits are the only direct way to weigh a star."
scene: "Among the Sun's neighbours, two bright points turn out to be families: Alpha Centauri, three stars held together, and Sirius, with a white dwarf circling it."
