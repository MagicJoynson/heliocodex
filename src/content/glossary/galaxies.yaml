# Galaxies and the universe as a whole.
terms:
  - id: galaxy
    term: Galaxy
    short: "A huge family of stars, gas and dust held together by gravity."
    more: "The smallest hold a few thousand stars and the largest more than a trillion."
    see: [milky-way, spiral-galaxy, elliptical-galaxy]
    lesson: kinds-of-galaxy
  - id: milky-way
    term: Milky Way
    also: [the Galaxy]
    short: "The galaxy we live in. From inside it shows as a pale band of light across a dark sky."
    more: "It is a flat disc of stars about 100,000 light years across, with the Sun roughly half way out from the centre."
    see: [galaxy, spiral-galaxy, local-group]
    lesson: the-milky-way
  - id: spiral-galaxy
    term: Spiral galaxy
    short: "A galaxy shaped like a flat, turning disc with bright arms winding out from the middle."
    more: "The arms are where new stars are forming. In about two thirds of spirals, the Milky Way among them, the arms start from a straight bar of stars."
    see: [galaxy, elliptical-galaxy, milky-way]
    lesson: kinds-of-galaxy
  - id: elliptical-galaxy
    term: Elliptical galaxy
    short: "A smooth, rounded galaxy with no disc or arms, made mostly of old stars."
    more: "The largest galaxies known are ellipticals, built up from collisions between smaller galaxies."
    see: [galaxy, spiral-galaxy, galaxy-cluster]
    lesson: kinds-of-galaxy
  - id: local-group
    term: Local Group
    short: "The small family of galaxies that the Milky Way belongs to."
    more: "It has more than 80 known members spread over about 10 million light years. The Milky Way and Andromeda are much the largest."
    see: [milky-way, galaxy-cluster]
    lesson: kinds-of-galaxy
  - id: galaxy-cluster
    term: Galaxy cluster
    short: "Hundreds or thousands of galaxies held together by gravity."
    more: "Clusters are the largest things that gravity holds together. The nearest large one, in Virgo, is about 54 million light years away."
    see: [galaxy, local-group, dark-matter]
    lesson: kinds-of-galaxy
  - id: big-bang
    term: Big Bang
    short: "The hot, dense early state from which the universe has been expanding and cooling for 13.8 billion years."
    more: "It was not an explosion at one place in space. Space itself was expanding, everywhere at once."
    see: [cosmic-microwave-background, hubble-constant, redshift]
    lesson: the-expanding-universe
  - id: cosmic-microwave-background
    term: Cosmic microwave background
    also: [CMB]
    short: "The oldest light there is: a faint glow of microwaves coming from every direction in the sky."
    more: "It was released about 380,000 years after the Big Bang, when the universe first became clear enough for light to travel freely."
    see: [big-bang, redshift, look-back-time]
    lesson: the-expanding-universe
  - id: hubble-constant
    term: Hubble constant
    short: "The number that says how fast the universe is expanding today."
    more: "It is about 70 km/s for every megaparsec of distance, which is about 21 km/s for every million light years. Two ways of measuring it disagree by nearly a tenth."
    see: [redshift, big-bang, parsec]
    lesson: the-expanding-universe
  - id: dark-matter
    term: Dark matter
    short: "Matter that gives out no light at all and is known only by the pull of its gravity."
    more: "There seems to be about five times as much of it as of ordinary matter. Nobody yet knows what it is made of."
    see: [dark-energy, gravitational-lensing, galaxy-cluster]
    lesson: dark-matter-and-dark-energy
  - id: dark-energy
    term: Dark energy
    short: "The name for whatever is making the expansion of the universe speed up."
    more: "It was found in 1998. It makes up about 68 per cent of everything in the universe, and what it is remains unknown."
    see: [dark-matter, hubble-constant, big-bang]
    lesson: dark-matter-and-dark-energy
  - id: gravitational-lensing
    term: Gravitational lensing
    short: "The bending of light by gravity as it passes something massive."
    more: "A cluster of galaxies can bend the light of galaxies behind it into arcs. How strongly it bends shows how much mass is there, seen or unseen."
    see: [gravity, dark-matter, galaxy-cluster]
    lesson: dark-matter-and-dark-energy
  - id: cosmic-web
    term: Cosmic web
    short: "The pattern galaxies make on the largest scales: clusters joined by long threads, wrapped round nearly empty voids."
    more: "It formed as gravity drew matter towards wherever there was already slightly more of it."
    see: [galaxy-cluster, supercluster, void]
    lesson: the-cosmic-web
    view: { target: cosmic-web }
  - id: supercluster
    term: Supercluster
    short: "A large collection of galaxy clusters and groups, most of them not held together by gravity."
    more: "The Milky Way lies on the outer edge of one called Laniakea, about 520 million light years across."
    see: [galaxy-cluster, local-group, cosmic-web]
    lesson: the-cosmic-web
  - id: void
    term: Void
    also: [cosmic void]
    short: "A huge region of space with very few galaxies in it."
    more: "Voids are the gaps between the threads and walls of the cosmic web."
    see: [cosmic-web, galaxy-cluster]
    lesson: the-cosmic-web
  - id: zone-of-avoidance
    term: Zone of Avoidance
    short: "The strip of sky where the disc of our own galaxy hides the galaxies beyond it."
    more: "Dust and crowded stars in the Milky Way block the view, so maps of distant galaxies have an empty band along it."
    see: [milky-way, cosmic-web]
    lesson: the-cosmic-web
